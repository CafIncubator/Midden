name: Documentation improvement
description: Report missing, unclear, inaccurate, or inaccessible documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the page or provide the repository path and heading.
      placeholder: README.md, docs/usage-guides/cli-usage.md, or a URL
    validations:
      required: true
  - type: dropdown
    id: problem_type
    attributes:
      label: Type of problem
      options:
        - Missing information
        - Incorrect or outdated information
        - Unclear instructions
        - Broken link or example
        - Accessibility problem
        - Typographical or formatting problem
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is difficult, incorrect, or missing and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposed_change
    attributes:
      label: Suggested change
      description: Describe the correction or information that would resolve the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this documentation problem.
          required: true
        - label: I removed credentials, private URLs, identifying research data, and other sensitive information.
          required: true